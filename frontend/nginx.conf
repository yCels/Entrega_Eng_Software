server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # rotas do React Router (/campeonatos/3, /login...) não existem como arquivo:
    # devolve o index.html e o roteamento acontece no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos do build têm hash no nome, então podem ficar em cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
